<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Aurexion Labs logo">
  <defs>
    <!-- Neon glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger outer glow -->
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background is transparent by default -->

  <!-- alpha symbol (actual Greek alpha character) -->
  <text x="50" y="135" font-family="Noto Serif, Georgia, serif" font-weight="700"
        font-size="140" fill="#ff2bd0" stroke="#ff2bd0" stroke-width="1" filter="url(#glow)">
    α
  </text>

  <!-- small accent arc above alpha -->
  <path d="M28 70 Q88 12 150 64" fill="none" stroke="#ffae00" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- subtle base lines under alpha (decorative) -->
  <g transform="translate(60,145)" opacity="0.95">
    <rect x="0" y="40" width="62" height="6" rx="3" fill="#00e5ff" filter="url(#glow)"/>
    <rect x="0" y="54" width="48" height="6" rx="3" fill="#00e5ff" filter="url(#glow)"/>
    <rect x="0" y="68" width="28" height="6" rx="3" fill="#00e5ff" filter="url(#glow)"/>
  </g>

  <!-- brand text -->
  <text x="260" y="80" font-family="Segoe UI, Roboto, Noto Sans, Arial, sans-serif"
        font-weight="700" font-size="46" fill="#ff2bd0" filter="url(#glow)">
    AUREXION
  </text>
  <text x="260" y="146" font-family="Segoe UI, Roboto, Noto Sans, Arial, sans-serif"
        font-weight="700" font-size="56" fill="#00e5ff" filter="url(#glow-strong)">
    LABS
  </text>
</svg>

